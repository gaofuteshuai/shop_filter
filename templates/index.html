<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>商品智能筛选系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
      <!-- 1-3：白云漂浮元素 -->
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    
    <!-- 4-9：星点闪烁元素 -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    
    <div class="container mt-4">
        <h2><i class="fas fa-filter me-1"></i> 商品智能筛选系统</h2>

        <!-- 原始商品集合折叠面板 -->
        <div class="card mb-4">
            <div class="card-header bg-white">
                <button class="btn btn-link fw-bold d-flex align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#originalProducts">
                    <i class="fas fa-box-open me-2 text-primary"></i>
                    查看原始商品集合 S
                    <i class="fas fa-chevron-down ms-auto"></i>
                </button>
            </div>
            <div id="originalProducts" class="collapse">
                <div class="card-body">
                    <p><strong>当前商品列表：</strong></p>
                    <div class="row g-3">
                        {% for p in products %}
                        <div class="col-md-3 col-sm-6">
                            <div class="d-flex align-items-center p-2 border rounded">
                                <!-- 商品图片 -->
                                <img src="{{ p.image_url }}" alt="{{ p.name }}" class="me-3" style="width: 80px; height: 80px; object-fit: cover;">
                                <!-- 商品信息 -->
                                <div>
                                    <strong>{{ p.name }}</strong><br>
                                    类别：<span class="badge bg-info text-dark">{{ p.category }}</span><br>
                                    价格：<span class="badge bg-success">¥{{ p.price }}</span><br>
                                    包邮：<span class="badge bg-{% if p.free_shipping %}success{% else %}danger{% endif %}">
                                        {% if p.free_shipping %}<i class="fas fa-check"></i> 是{% else %}<i class="fas fa-times"></i> 否{% endif %}
                                    </span>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选表单 -->
        <form action="/result" method="GET" class="card p-4 shadow-sm">
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-tags"></i> 商品类别（可多选）</label>
                <div class="d-flex flex-wrap gap-2">
                    {% set categories = ['家电', '服装', '食品'] %}
                    {% for cat in categories %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="category" value="{{ cat }}" id="cat_{{ cat }}">
                        <label class="form-check-label btn btn-outline-primary btn-sm rounded-pill px-3" for="cat_{{ cat }}">
                            {{ cat }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="mb-4">
                <label for="priceRange" class="form-label"><i class="fas fa-money-bill-wave"></i> 价格区间</label>
                <select name="priceRange" class="form-select" id="priceRange">
                    <option value="">不限</option>
                    <option value="0-100">0 - 100 元</option>
                    <option value="100-500">100 - 500 元</option>
                    <option value="500+">500 元以上</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="fas fa-shipping-fast"></i> 是否包邮</label>
                <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="shipping" value="" id="ship_any" checked>
                        <label class="form-check-label" for="ship_any">不限</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="shipping" value="yes" id="ship_yes">
                        <label class="form-check-label" for="ship_yes"><i class="fas fa-truck text-success"></i> 是</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="shipping" value="no" id="ship_no">
                        <label class="form-check-label" for="ship_no"><i class="fas fa-times-circle text-danger"></i> 否</label>
                    </div>
                </div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-search"></i> 开始筛选
                </button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
