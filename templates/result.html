<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>筛选结果</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
     <!-- 1-3：白云漂浮元素 -->
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    
    <!-- 4-9：星点闪烁元素 -->
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    
    <div class="container mt-5">
        <h2><i class="fas fa-check-circle me-2"></i> 筛选结果</h2>

        <div class="alert alert-info">
            集合运算表达式： <code>{{ expression }}</code>
        </div>

        <div class="row g-4">
            {% if results %}
                {% for item in results %}
                <div class="col-md-3 col-sm-6">
                    <div class="card result-card h-100">
                        <!-- 商品图片 -->
                        <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.name }}" style="height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title">{{ item.name }}</h5>
                            <p>类别：{{ item.category }}</p>
                            <p>价格：¥{{ item.price }}</p>
                            <p>{{ '📦 包邮' if item.free_shipping else '🚚 不包邮' }}</p>
                        </div>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="col-12 text-center">
                    <p class="text-muted fs-5">
                        <i class="fas fa-search fa-2x mb-2"></i><br>
                        没有找到符合条件的商品，请尝试调整筛选条件。
                    </p>
                </div>
            {% endif %}
        </div>

        <a href="/" class="btn btn-secondary mt-4">返回重新筛选</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
